# Builds the Next.js static export and publishes it to GitHub Pages.
#
# Set Settings → Pages → Source to "GitHub Actions" (not "Deploy from a
# branch") or this workflow's output will be ignored and Pages will keep
# serving the repo root.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # The schedule ("next stop" on Home, the dates on /find-us) is resolved at
  # BUILD time, because the site is a static export — `new Date()` in
  # content/schedule.ts is the build clock, not the visitor's. Without a
  # rebuild the trailer would keep advertising a date that has already passed.
  # 09:00 UTC is ~2-3am Mountain, so each day flips over before anyone looks.
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
